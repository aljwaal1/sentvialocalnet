plugins { id 'com.android.application' }

// Secure signing is enabled only when GitHub Actions (or a local developer)
// provides a keystore path and credentials through environment variables.
def secureKeystorePath = System.getenv('SVLN_KEYSTORE_PATH')
def secureStorePassword = System.getenv('SVLN_STORE_PASSWORD')
def secureKeyAlias = System.getenv('SVLN_KEY_ALIAS')
def secureKeyPassword = System.getenv('SVLN_KEY_PASSWORD')
def hasSecureSigning = secureKeystorePath != null && secureKeystorePath.trim().length() > 0 &&
        secureStorePassword != null && secureKeyAlias != null && secureKeyPassword != null &&
        file(secureKeystorePath).exists()

android {
    namespace 'com.explapp.sendvialocalnet'
    compileSdk 35

    signingConfigs {
        if (hasSecureSigning) {
            secureRelease {
                storeFile file(secureKeystorePath)
                storePassword secureStorePassword
                keyAlias secureKeyAlias
                keyPassword secureKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId 'com.explapp.sendvialocalnet'
        minSdk 19
        targetSdk 28
        versionCode 4
        versionName '2.0.2'
    }

    buildTypes {
        debug {
            if (hasSecureSigning) signingConfig signingConfigs.secureRelease
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
