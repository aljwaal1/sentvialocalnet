plugins { id 'com.android.application' }

// A repository-owned development key keeps APK signatures stable between
// GitHub Actions runners, so future APK builds can update this version.
def stableKeystoreSource = file('debug-keystore.b64')
def stableKeystoreFile = file("${buildDir}/generated/svln-debug.p12")
if (stableKeystoreSource.exists()) {
    stableKeystoreFile.parentFile.mkdirs()
    stableKeystoreFile.bytes = stableKeystoreSource.text.trim().decodeBase64()
}

android {
    namespace 'com.explapp.sendvialocalnet'
    compileSdk 35

    signingConfigs {
        stableDebug {
            storeFile stableKeystoreFile
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeType 'PKCS12'
        }
    }

    defaultConfig {
        applicationId 'com.explapp.sendvialocalnet'
        minSdk 19
        targetSdk 28
        versionCode 3
        versionName '2.0.1'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stableDebug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
