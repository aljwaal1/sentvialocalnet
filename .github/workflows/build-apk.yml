name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-apk.yml'
  push:
    branches: [ main ]
    paths-ignore:
      - 'apk/**'
      - 'DOWNLOAD_APK.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure secure signing when secrets exist
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SVLN_KEYSTORE_B64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.SVLN_STORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.SVLN_KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.SVLN_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD_SECRET" ] && [ -n "$KEY_ALIAS_SECRET" ] && [ -n "$KEY_PASSWORD_SECRET" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > app/release-keystore.jks
            echo "SVLN_KEYSTORE_PATH=$GITHUB_WORKSPACE/app/release-keystore.jks" >> "$GITHUB_ENV"
            echo "SVLN_STORE_PASSWORD=$STORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "SVLN_KEY_ALIAS=$KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "SVLN_KEY_PASSWORD=$KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "Secure Android signing enabled."
          else
            echo "Signing secrets are not configured; using the runner debug key for this build."
          fi

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/send-via-local-net.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SendViaLocalNet-Android
          path: apk/send-via-local-net.apk
          if-no-files-found: error

      - name: Publish APK to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cat > DOWNLOAD_APK.md <<'EOF'
          # تحميل تطبيق Android

          التطبيق يدعم Android 4.4 (API 19) فما فوق:

          https://github.com/aljwaal1/sentvialocalnet/raw/main/apk/send-via-local-net.apk
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/send-via-local-net.apk DOWNLOAD_APK.md
          git commit -m "Build Android APK [skip ci]" || echo "No changes"
          git pull --rebase origin main
          git push origin HEAD:main
