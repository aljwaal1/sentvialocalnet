name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-apk.yml'
  push:
    branches: [ main ]
    paths-ignore:
      - 'apk/**'
      - 'DOWNLOAD_APK.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/send-via-local-net.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SendViaLocalNet-Android
          path: apk/send-via-local-net.apk
          if-no-files-found: error

      - name: Publish APK to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cat > DOWNLOAD_APK.md <<'EOF'
          # تحميل تطبيق Android

          التطبيق يدعم Android 4.4 (API 19) فما فوق:

          https://github.com/aljwaal1/sentvialocalnet/raw/main/apk/send-via-local-net.apk
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/send-via-local-net.apk DOWNLOAD_APK.md
          git commit -m "Build Android APK [skip ci]" || echo "No changes"
          git push
