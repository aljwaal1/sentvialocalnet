name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-apk.yml'
  push:
    branches: [ main, pwa-iphone-windows-transfer ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'VERSION'
      - 'tools/qa_check.py'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure secure signing when secrets exist
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SVLN_KEYSTORE_B64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.SVLN_STORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.SVLN_KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.SVLN_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD_SECRET" ] && [ -n "$KEY_ALIAS_SECRET" ] && [ -n "$KEY_PASSWORD_SECRET" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > app/release-keystore.jks
            echo "SVLN_KEYSTORE_PATH=$GITHUB_WORKSPACE/app/release-keystore.jks" >> "$GITHUB_ENV"
            echo "SVLN_STORE_PASSWORD=$STORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "SVLN_KEY_ALIAS=$KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "SVLN_KEY_PASSWORD=$KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "Secure Android signing enabled."
          else
            echo "Signing secrets are not configured; using the runner debug key for this build."
          fi

      - name: Cross-platform QA guard
        run: python3 tools/qa_check.py

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/send-via-local-net.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SendViaLocalNet-Android
          path: apk/send-via-local-net.apk
          if-no-files-found: error

      - name: Publish direct APK download files
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          BRANCH="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          SOURCE="apk/send-via-local-net.apk"

          publish_file() {
            local TARGET="$1"
            local MESSAGE="$2"
            local CONTENT
            local SHA

            CONTENT="$(base64 -w 0 "${SOURCE}")"
            SHA="$(gh api "repos/${REPO}/contents/${TARGET}?ref=${BRANCH}" --jq '.sha' 2>/dev/null || true)"

            if [ -n "${SHA}" ]; then
              gh api --method PUT "repos/${REPO}/contents/${TARGET}" \
                -f message="${MESSAGE}" \
                -f content="${CONTENT}" \
                -f branch="${BRANCH}" \
                -f sha="${SHA}" >/dev/null
            else
              gh api --method PUT "repos/${REPO}/contents/${TARGET}" \
                -f message="${MESSAGE}" \
                -f content="${CONTENT}" \
                -f branch="${BRANCH}" >/dev/null
            fi
          }

          # Stable alias + immutable versioned filename.
          publish_file "apk/send-via-local-net.apk" "Publish Android APK v${VERSION} [skip ci]"
          publish_file "apk/SendViaLocalNet-v${VERSION}.apk" "Publish versioned Android APK v${VERSION} [skip ci]"

          echo "Android direct downloads published:"
          echo "https://raw.githubusercontent.com/${REPO}/${BRANCH}/apk/send-via-local-net.apk"
          echo "https://raw.githubusercontent.com/${REPO}/${BRANCH}/apk/SendViaLocalNet-v${VERSION}.apk"
