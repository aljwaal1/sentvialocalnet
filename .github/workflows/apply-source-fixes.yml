name: Apply Source Fixes

on:
  push:
    branches: [ agent/pro-ui-multi-device ]
    paths:
      - 'tools/apply_source_fixes.py'
      - '.github/workflows/apply-source-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pro-ui-multi-device
      - name: Apply targeted source fixes
        run: python tools/apply_source_fixes.py
      - name: Remove temporary patch files
        run: rm tools/apply_source_fixes.py .github/workflows/apply-source-fixes.yml
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Android 4.4 compatibility"
          git push
