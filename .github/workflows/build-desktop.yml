name: Build Windows Installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
  push:
    branches: [ main ]
    paths-ignore:
      - 'desktop/release/**'
      - 'DOWNLOAD_WINDOWS.md'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r desktop/requirements.txt

      - name: Validate Python source
        run: python -m py_compile desktop/app.py desktop/discovery_responder.py desktop/windows_runtime.py desktop/launcher.py

      - name: Build standalone EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name SendViaLocalNet --add-data "desktop/web;web" --paths desktop --distpath desktop/dist --workpath desktop/build desktop/launcher.py

      - name: Verify standalone EXE
        shell: pwsh
        run: |
          if (-not (Test-Path "desktop/dist/SendViaLocalNet.exe")) { throw "EXE was not created" }
          Get-Item "desktop/dist/SendViaLocalNet.exe"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: cmd
        run: iscc desktop\installer.iss

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: SendViaLocalNet-Windows
          path: |
            desktop/dist/SendViaLocalNet.exe
            desktop/release/SendViaLocalNet-Setup.exe
          if-no-files-found: error

      - name: Publish installer to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          cat > DOWNLOAD_WINDOWS.md <<'EOF'
          # تحميل برنامج Windows

          ملف التثبيت المباشر:

          https://github.com/aljwaal1/sentvialocalnet/raw/main/desktop/release/SendViaLocalNet-Setup.exe

          الإصدار الجديد يعرض IP الحالي، يمنع تشغيل نسختين، ويغلق النسخة المفتوحة تلقائيًا أثناء التحديث ثم يعيد تشغيل البرنامج.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/release/SendViaLocalNet-Setup.exe DOWNLOAD_WINDOWS.md
          git commit -m "Build Windows installer [skip ci]" || echo "No changes"
          git pull --rebase origin main
          git push origin HEAD:main
