name: Build Windows Installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
  push:
    branches: [ main, pwa-iphone-windows-transfer ]
    paths:
      - 'desktop/app.py'
      - 'desktop/discovery_responder.py'
      - 'desktop/launcher.py'
      - 'desktop/windows_runtime.py'
      - 'desktop/installer.iss'
      - 'desktop/requirements.txt'
      - 'desktop/stop_running_app.ps1'
      - 'desktop/web/**'
      - 'VERSION'
      - 'tools/qa_check.py'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: write


jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r desktop/requirements.txt

      - name: Validate Python source
        run: python -m py_compile desktop/app.py desktop/discovery_responder.py desktop/windows_runtime.py desktop/launcher.py

      - name: Cross-platform QA guard
        run: python tools/qa_check.py

      - name: Build standalone EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name SendViaLocalNet --add-data "desktop/web;web" --paths desktop --distpath desktop/dist --workpath desktop/build desktop/launcher.py

      - name: Verify standalone EXE
        shell: pwsh
        run: |
          if (-not (Test-Path "desktop/dist/SendViaLocalNet.exe")) { throw "EXE was not created" }
          Get-Item "desktop/dist/SendViaLocalNet.exe"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: cmd
        run: iscc desktop\installer.iss

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: SendViaLocalNet-Windows
          path: |
            desktop/dist/SendViaLocalNet.exe
            desktop/release/SendViaLocalNet-Setup.exe
          if-no-files-found: error

      - name: Publish direct Windows download files
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          BRANCH="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          SOURCE="desktop/release/SendViaLocalNet-Setup.exe"

          publish_file() {
            local TARGET="$1"
            local MESSAGE="$2"
            local SHA
            local B64_FILE
            local PAYLOAD

            SHA="$(gh api "repos/${REPO}/contents/${TARGET}?ref=${BRANCH}" --jq '.sha' 2>/dev/null || true)"
            B64_FILE="$(mktemp)"
            PAYLOAD="$(mktemp)"

            # Keep the large EXE content out of the command line to avoid
            # Windows/Git Bash "Argument list too long".
            base64 "${SOURCE}" | tr -d '\r\n' > "${B64_FILE}"

            if [ -n "${SHA}" ]; then
              jq -n \
                --arg message "${MESSAGE}" \
                --arg branch "${BRANCH}" \
                --arg sha "${SHA}" \
                --rawfile content "${B64_FILE}" \
                '{message:$message,branch:$branch,sha:$sha,content:$content}' > "${PAYLOAD}"
            else
              jq -n \
                --arg message "${MESSAGE}" \
                --arg branch "${BRANCH}" \
                --rawfile content "${B64_FILE}" \
                '{message:$message,branch:$branch,content:$content}' > "${PAYLOAD}"
            fi

            gh api --method PUT "repos/${REPO}/contents/${TARGET}" --input "${PAYLOAD}" >/dev/null
            rm -f "${B64_FILE}" "${PAYLOAD}"
          }

          publish_file "desktop/release/SendViaLocalNet-Setup.exe" "Publish Windows installer v${VERSION} [skip ci]"
          publish_file "desktop/release/SendViaLocalNet-Windows-v${VERSION}.exe" "Publish versioned Windows installer v${VERSION} [skip ci]"

          echo "Windows direct downloads published:"
          echo "https://raw.githubusercontent.com/${REPO}/${BRANCH}/desktop/release/SendViaLocalNet-Setup.exe"
          echo "https://raw.githubusercontent.com/${REPO}/${BRANCH}/desktop/release/SendViaLocalNet-Windows-v${VERSION}.exe"
