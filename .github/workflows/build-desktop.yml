name: Build Windows Installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
  push:
    branches: [ main, pwa-iphone-windows-transfer ]
    paths:
      - 'desktop/app.py'
      - 'desktop/discovery_responder.py'
      - 'desktop/launcher.py'
      - 'desktop/windows_runtime.py'
      - 'desktop/installer.iss'
      - 'desktop/requirements.txt'
      - 'desktop/stop_running_app.ps1'
      - 'desktop/web/**'
      - 'VERSION'
      - 'tools/qa_check.py'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: write


jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r desktop/requirements.txt

      - name: Validate Python source
        run: python -m py_compile desktop/app.py desktop/discovery_responder.py desktop/windows_runtime.py desktop/launcher.py

      - name: Cross-platform QA guard
        run: python tools/qa_check.py

      - name: Build standalone EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name SendViaLocalNet --add-data "desktop/web;web" --paths desktop --distpath desktop/dist --workpath desktop/build desktop/launcher.py

      - name: Verify standalone EXE
        shell: pwsh
        run: |
          if (-not (Test-Path "desktop/dist/SendViaLocalNet.exe")) { throw "EXE was not created" }
          Get-Item "desktop/dist/SendViaLocalNet.exe"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: cmd
        run: iscc desktop\installer.iss

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: SendViaLocalNet-Windows
          path: |
            desktop/dist/SendViaLocalNet.exe
            desktop/release/SendViaLocalNet-Setup.exe
          if-no-files-found: error

      - name: Publish versioned Windows installer to GitHub Release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          TAG="v${VERSION}"
          ASSET="SendViaLocalNet-Windows-v${VERSION}.exe"
          cp desktop/release/SendViaLocalNet-Setup.exe "${ASSET}"

          for attempt in 1 2 3 4 5; do
            if ! gh release view "${TAG}" >/dev/null 2>&1; then
              gh release create "${TAG}"                 --target "${GITHUB_SHA}"                 --title "SendViaLocalNet ${TAG}"                 --notes "Automated cross-platform build for ${TAG}."
            fi

            if gh release upload "${TAG}" "${ASSET}" --clobber; then
              echo "Published ${ASSET}"
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo "Failed to publish Windows release asset"
          exit 1
