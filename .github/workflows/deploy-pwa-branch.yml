name: Deploy PWA branch

on:
  push:
    branches:
      - pwa-iphone-windows-transfer
    paths:
      - 'pwa/**'
      - '.github/workflows/deploy-pwa-branch.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-pwa-iphone-windows-transfer
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pwa
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
