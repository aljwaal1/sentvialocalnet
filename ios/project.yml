name: SendViaLocalNet
options:
  bundleIdPrefix: com.explapp
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 15.0
targets:
  SendViaLocalNet:
    type: application
    platform: iOS
    sources:
      - path: SendViaLocalNet
    info:
      path: SendViaLocalNet/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.explapp.sendvialocalnet
        PRODUCT_NAME: SendViaLocalNet
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: false
