<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إرسال محلي V6</title>
<style>
body{font-family:Tahoma,Arial;background:#f3f7f4;margin:0;padding:22px;color:#132017}.card{max-width:1050px;margin:auto;background:#fff;border-radius:20px;padding:22px;box-shadow:0 10px 30px #0002}h1{text-align:center;color:#1b5e20;margin:0 0 12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.row{grid-template-columns:1fr}}input,select,button{box-sizing:border-box;width:100%;padding:13px;margin-top:9px;border-radius:12px;font-size:16px}input,select{border:1px solid #ccd8cf}button{border:0;background:#2e7d32;color:#fff;font-weight:bold;cursor:pointer}.blue{background:#1565c0}.brown{background:#6d4c41}.red{background:#c62828}.gray{background:#607d8b}.status{margin-top:14px;background:#eef7ee;border:1px solid #d7ead8;border-radius:12px;padding:13px;white-space:pre-wrap;line-height:1.7}.dev{border:1px solid #dce7de;background:#fbfffb;border-radius:12px;padding:10px;margin-top:8px;display:flex;justify-content:space-between;align-items:center}.dev button{width:auto;margin:0;padding:8px 14px}table{width:100%;border-collapse:collapse;margin-top:14px;background:white}th,td{border:1px solid #dce7de;padding:9px;text-align:right;font-size:14px}th{background:#e8f5e9;color:#1b5e20}.ok{color:#1b5e20;font-weight:bold}.fail{color:#c62828;font-weight:bold}.run{color:#1565c0;font-weight:bold}.small{font-size:12px;color:#607568}.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}@media(max-width:760px){.tools{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="card">
<h1>إرسال محلي V6 - سجل الفشل والنجاح</h1>
<p>اختر الملفات ثم أرسل. إذا فشل ملف، سيظهر اسمه وسبب الفشل، وتستطيع إعادة إرسال الملفات الفاشلة.</p>
<div class="row"><div><label>شبكة الفحص</label><select id="subnet"><option value="192.168.1">192.168.1.x</option><option value="192.168.8">192.168.8.x</option><option value="192.168.0">192.168.0.x</option><option value="10.0.0">10.0.0.x</option></select></div><div><label>IP الهاتف</label><input id="phoneIp" placeholder="مثال: 192.168.8.105"></div></div>
<div class="tools"><button class="blue" onclick="scanNetwork()">بحث تلقائي</button><button class="brown" onclick="stopScan()">إيقاف البحث</button><button class="gray" onclick="saveIp()">حفظ IP</button><button class="red" onclick="clearLog()">مسح السجل</button></div>
<div id="devices"></div>
<label>اختر ملفات</label><input id="fileInput" type="file" multiple>
<div class="tools"><button onclick="sendFiles()">إرسال الملفات</button><button class="blue" onclick="retryFailed()">إعادة إرسال الفاشلة</button><button class="gray" onclick="exportLog()">تصدير السجل</button><button class="brown" onclick="showOnlyFailed()">عرض الفاشلة فقط</button></div>
<div id="status" class="status">جاهز. شغّل استقبال الهاتف أولًا. سيتم حفظ آخر IP تلقائيًا.</div>
<h3>سجل الإرسال</h3>
<table><thead><tr><th>الحالة</th><th>اسم الملف</th><th>الحجم</th><th>الوقت</th><th>السبب</th><th>إجراء</th></tr></thead><tbody id="logBody"></tbody></table>
</div>
<script>
let scanning=false,selectedIp='',logs=[],fileMap=new Map(),failedFiles=[];
function $(id){return document.getElementById(id)};function setStatus(t){$('status').textContent=t}
function now(){return new Date().toLocaleString('ar-JO')}
function fmt(b){return b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB'}
function load(){const ip=localStorage.getItem('svln_ip')||'';$('phoneIp').value=ip;selectedIp=ip;try{logs=JSON.parse(localStorage.getItem('svln_logs')||'[]')}catch(e){logs=[]}renderLog()}
function saveLogs(){localStorage.setItem('svln_logs',JSON.stringify(logs.slice(-100)))}
function saveIp(){const ip=$('phoneIp').value.trim();if(ip){localStorage.setItem('svln_ip',ip);selectedIp=ip;setStatus('تم حفظ IP: '+ip)}}
function choose(ip){selectedIp=ip;$('phoneIp').value=ip;saveIp();setStatus('تم اختيار الهاتف: '+ip)}
function stopScan(){scanning=false;setStatus('تم إيقاف البحث.')}
async function ping(ip){const c=new AbortController();const t=setTimeout(()=>c.abort(),850);try{const r=await fetch('http://'+ip+':5051/upload',{method:'GET',mode:'cors',signal:c.signal});clearTimeout(t);return r.ok}catch(e){clearTimeout(t);return false}}
async function scanNetwork(){scanning=true;$('devices').innerHTML='';const subnet=$('subnet').value;let found=0;for(let start=1;start<=254&&scanning;start+=16){let jobs=[];for(let i=start;i<start+16&&i<=254;i++){let ip=subnet+'.'+i;jobs.push(ping(ip).then(ok=>({ip,ok})))}let res=await Promise.all(jobs);for(const r of res){if(r.ok){found++;addDevice(r.ip);if(!selectedIp)choose(r.ip)}}setStatus('جاري البحث... وجد: '+found)}}
function addDevice(ip){const d=document.createElement('div');d.className='dev';d.innerHTML='<b>📱 '+ip+':5051</b><button onclick="choose(\''+ip+'\')">اختيار</button>';$('devices').appendChild(d)}
function addLog(status,file,reason){const item={id:Date.now()+Math.random(),status,name:file.name,size:file.size,time:now(),reason:reason||'',key:file.name+'|'+file.size};logs.unshift(item);logs=logs.slice(0,100);saveLogs();renderLog();return item.id}
function updateLog(id,status,reason){const x=logs.find(a=>a.id===id);if(x){x.status=status;x.reason=reason||x.reason;x.time=now();saveLogs();renderLog()}}
function renderLog(filterFail=false){const body=$('logBody');body.innerHTML='';const list=filterFail?logs.filter(x=>x.status==='فشل'):logs;for(const x of list){const cls=x.status==='تم'?'ok':x.status==='فشل'?'fail':'run';const tr=document.createElement('tr');tr.innerHTML='<td class="'+cls+'">'+x.status+'</td><td>'+x.name+'</td><td>'+fmt(x.size)+'</td><td>'+x.time+'</td><td>'+x.reason+'</td><td><button onclick="retryByKey(\''+x.key.replace(/'/g,'')+'\')">إعادة</button></td>';body.appendChild(tr)}}
function showOnlyFailed(){renderLog(true)}
function clearLog(){logs=[];saveLogs();renderLog();setStatus('تم مسح السجل.')}
async function sendFiles(){const files=[...$('fileInput').files];for(const f of files){fileMap.set(f.name+'|'+f.size,f)}await sendQueue(files)}
async function sendQueue(files){const ip=$('phoneIp').value.trim()||selectedIp;if(!ip){setStatus('اكتب IP الهاتف.');return}if(!files.length){setStatus('اختر ملفات.');return}saveIp();$('fileInput').disabled=true;let ok=0,fail=0;for(const file of files){const id=addLog('جاري',file,'');setStatus('جاري إرسال: '+file.name+'\nالحجم: '+fmt(file.size));try{const r=await fetch('http://'+ip+':5051/upload',{method:'POST',headers:{'Content-Type':'application/octet-stream','X-File-Name':encodeURIComponent(file.name),'X-File-Size':String(file.size)},body:file});if(r.ok){ok++;updateLog(id,'تم','تم الإرسال')}else{fail++;let txt=await r.text().catch(()=>'');updateLog(id,'فشل','كود '+r.status+' '+txt)}}catch(e){fail++;updateLog(id,'فشل',e.message)}}$('fileInput').disabled=false;setStatus('انتهى الإرسال.\nنجح: '+ok+'\nفشل: '+fail+'\nأسماء الملفات الفاشلة موجودة في الجدول باللون الأحمر.')}
function retryByKey(key){const f=fileMap.get(key);if(!f){setStatus('لا أستطيع إعادة هذا الملف بعد إغلاق الصفحة. اختر الملف مرة أخرى.');return}sendQueue([f])}
function retryFailed(){const arr=[];for(const x of logs.filter(a=>a.status==='فشل')){const f=fileMap.get(x.key);if(f)arr.push(f)}if(!arr.length){setStatus('لا توجد ملفات فاشلة قابلة للإعادة الآن. اخترها مرة أخرى إذا أغلقت الصفحة.');return}sendQueue(arr)}
function exportLog(){const text=logs.map(x=>[x.status,x.name,fmt(x.size),x.time,x.reason].join('\t')).join('\n');const blob=new Blob([text],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='send-log.txt';a.click()}
load();
</script>
</body></html>
