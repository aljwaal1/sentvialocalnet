<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إرسال محلي V5 - الكمبيوتر إلى الهاتف</title>
<style>
:root{--g:#2e7d32;--bg:#f3f7f4;--card:#fff;--txt:#132017;--mut:#607568}
body{font-family:Tahoma,Arial,sans-serif;background:var(--bg);margin:0;padding:24px;color:var(--txt)}
.card{max-width:820px;margin:auto;background:var(--card);border-radius:22px;padding:24px;box-shadow:0 12px 35px rgba(0,0,0,.10)}
h1{text-align:center;color:#1b5e20;margin:0 0 8px;font-size:28px}.hint{line-height:1.8;color:var(--mut)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.row{grid-template-columns:1fr}}
label{font-weight:bold;margin-top:14px;display:block}input,select{box-sizing:border-box;width:100%;padding:14px;margin-top:8px;border:1px solid #ccd8cf;border-radius:14px;font-size:16px;background:#fff}
button{border:0;border-radius:14px;background:var(--g);color:white;font-size:17px;font-weight:bold;padding:14px;cursor:pointer;margin-top:12px;width:100%}button:disabled{background:#9e9e9e}.secondary{background:#1565c0}.danger{background:#6d4c41}
.status{margin-top:16px;background:#eef7ee;border:1px solid #d7ead8;border-radius:14px;padding:14px;white-space:pre-wrap;line-height:1.7}.devices{margin-top:14px;display:grid;gap:10px}.dev{border:1px solid #dce7de;background:#fbfffb;border-radius:14px;padding:12px;display:flex;gap:10px;justify-content:space-between;align-items:center}.dev b{color:#1b5e20}.dev button{width:auto;margin:0;padding:10px 16px}.small{font-size:13px;color:#607568}.pill{display:inline-block;background:#e8f5e9;color:#1b5e20;border-radius:999px;padding:5px 10px;margin:3px}
</style>
</head>
<body>
<div class="card">
<h1>إرسال ملف من الكمبيوتر إلى الهاتف V5</h1>
<p class="hint">هذه النسخة ترسل الملف مباشرة Raw Stream، وهي أفضل للملفات الكبيرة مثل ٨٩ ميجا. افتح تطبيق الأندرويد V5 واضغط <b>تشغيل استقبال الملفات على الهاتف</b>.</p>

<div class="row">
  <div>
    <label>شبكة الفحص</label>
    <select id="subnet">
      <option value="192.168.1">192.168.1.x</option>
      <option value="192.168.8">192.168.8.x</option>
      <option value="192.168.0">192.168.0.x</option>
      <option value="10.0.0">10.0.0.x</option>
      <option value="172.16.0">172.16.0.x</option>
    </select>
  </div>
  <div>
    <label>IP الهاتف</label>
    <input id="phoneIp" placeholder="مثال: 192.168.8.105" inputmode="numeric">
  </div>
</div>

<div class="row">
  <button class="secondary" onclick="scanNetwork()" id="scanBtn">بحث تلقائي عن الهاتف</button>
  <button class="danger" onclick="stopScan()" id="stopBtn">إيقاف البحث</button>
</div>

<div id="devices" class="devices"></div>

<label>اختر ملفات من الكمبيوتر</label>
<input id="fileInput" type="file" multiple>
<button id="sendBtn" onclick="sendFiles()">إرسال للهاتف</button>

<div id="status" class="status">جاهز. شغّل استقبال الهاتف أولًا.</div>
<p class="small"><span class="pill">V5 Streaming</span><span class="pill">مناسب للملفات الكبيرة</span><span class="pill">الحفظ في Download/SendViaLocalNet</span></p>
</div>

<script>
let scanning=false;
let selectedIp='';
function $(id){return document.getElementById(id)}
function setStatus(t){$('status').textContent=t}
function choose(ip){selectedIp=ip;$('phoneIp').value=ip;setStatus('تم اختيار الهاتف: '+ip+'\nاختر الملف واضغط إرسال.');}
function stopScan(){scanning=false;setStatus('تم إيقاف البحث.');}
async function ping(ip){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),850);
  try{
    const r=await fetch('http://'+ip+':5051/upload',{method:'GET',mode:'cors',signal:ctrl.signal});
    clearTimeout(timer);
    if(r.ok)return true;
  }catch(e){clearTimeout(timer)}
  return false;
}
async function scanNetwork(){
  scanning=true;$('devices').innerHTML='';selectedIp='';
  const subnet=$('subnet').value;const found=[];
  setStatus('جاري البحث في '+subnet+'.x ...');
  for(let start=1;start<=254&&scanning;start+=16){
    const jobs=[];
    for(let i=start;i<start+16&&i<=254;i++){const ip=subnet+'.'+i;jobs.push(ping(ip).then(ok=>({ip,ok})));}
    const results=await Promise.all(jobs);
    for(const r of results){if(r.ok&&!found.includes(r.ip)){found.push(r.ip);addDevice(r.ip);if(!selectedIp)choose(r.ip);}}
    setStatus('تم فحص حتى '+subnet+'.'+Math.min(start+15,254)+'\nالأجهزة الموجودة: '+found.length);
  }
  scanning=false;
  setStatus(found.length?'انتهى البحث. اختر الجهاز ثم أرسل.':'لم يتم العثور على الهاتف. اكتب IP يدويًا كما يظهر في تطبيق الأندرويد.');
}
function addDevice(ip){
  const d=document.createElement('div');d.className='dev';
  d.innerHTML='<div><b>📱 هاتف Android</b><br><span class="small">'+ip+':5051</span></div><button onclick="choose(\''+ip+'\')">اختيار</button>';
  $('devices').appendChild(d);
}
async function sendFiles(){
  const ip=($('phoneIp').value.trim()||selectedIp);
  const files=$('fileInput').files;
  if(!ip){setStatus('اكتب IP الهاتف أو اختره من البحث.');return}
  if(!files.length){setStatus('اختر ملفًا واحدًا على الأقل.');return}
  $('sendBtn').disabled=true;
  let ok=0,fail=0;
  for(const file of files){
    setStatus('جاري إرسال: '+file.name+'\nالحجم: '+formatSize(file.size)+'\nإلى: '+ip+'\nلا تغلق الصفحة أثناء الإرسال.');
    try{
      const r=await fetch('http://'+ip+':5051/upload',{
        method:'POST',
        headers:{
          'Content-Type':'application/octet-stream',
          'X-File-Name':encodeURIComponent(file.name),
          'X-File-Size':String(file.size)
        },
        body:file
      });
      if(r.ok){ok++;setStatus('تم إرسال '+file.name+' بنجاح.')}else{fail++;setStatus('فشل إرسال '+file.name+'\nالكود: '+r.status+'\n'+await r.text().catch(()=>''));}
    }catch(e){fail++;setStatus('فشل إرسال '+file.name+'\n'+e.message+'\nتأكد أن شاشة الهاتف لم تغلق Wi-Fi وأن التطبيق على وضع الاستقبال.');}
  }
  $('sendBtn').disabled=false;
  setStatus('انتهى الإرسال.\nنجح: '+ok+'\nفشل: '+fail+'\nافتح Download/SendViaLocalNet على الهاتف.');
}
function formatSize(bytes){
  if(bytes<1024)return bytes+' B';
  if(bytes<1024*1024)return (bytes/1024).toFixed(1)+' KB';
  if(bytes<1024*1024*1024)return (bytes/1024/1024).toFixed(1)+' MB';
  return (bytes/1024/1024/1024).toFixed(1)+' GB';
}
</script>
</body>
</html>
